<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log-in</title>
    <link rel="stylesheet" href="../css/login.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

</head>
</head>

<body>
    <header></header>
    <main class="container-fluid ">
        <div class="all">
            <div class="left">
                <!-- <h1>WELLCOME BACK!</h1> -->
            </div>
            <div class="right d-flex ">

                <div class="form-section d-block">
                    <img id="logo-login" src="../img/logo.svg" alt="Logo image">
                    <div class="choose">
                        <div class="choose-left">
                            <h3><a id="active" href="../html/login.html">เข้าสู่ระบบ</a></h3>
                        </div>
                        <div class="choose-right">
                            <h3><a id="unactive" href="../html/register.html">สมัครสมาชิก</a></h3>
                        </div>
                    </div>
                    <div class="form">

                        <label for="username">ชื่อ-สกุล หรือ อีเมล</label>
                        <input type="text" name="username" placeholder="ชื่อ-สกุล หรือ อีเมล">

                        <div class="password-box">
                            <label for="password">รหัสผ่าน</label>
                            <input type="password" name="password" id="password" placeholder="รหัสผ่าน">
                            <i id="eye" class="bi bi-eye-slash"></i>
                        </div>
                        <a href="#" class="forgot">ลืมรหัสผ่าน</a>
                    </div>
                    <div class="lower">
                        <a href="../html/tutor_home.html" class="login-btn">เข้าสู่ระบบ</a>
                        <p class="register-text">
                            ยังไม่มีบัญชีใช่ไหม?
                            <a href="#">สร้างได้เลย</a>
                        </p>
                    </div>

                    <div class="1 d-flex">
                        <div class="2"></div>
                        <div class="3"></div>
                    </div>



                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/login.js"></script>

</body>

</html>
