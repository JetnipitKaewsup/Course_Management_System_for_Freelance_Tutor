<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log-in</title>
    <link rel="stylesheet" href="../css/register.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
</head>

<body>
    <header></header>
    <main class="container-fluid ">
        <div class="all">
            <div class="left">
                <h1>HELLO !</h1>
            </div>
            <div class="right d-flex ">
                <div class="form-section d-block">
                    <img id="logo-login" src="../img/logo.svg" alt="Logo image">
                    <div class="choose">
                        <div class="choose-left">
                            <h3><a id="unactive" href="../html/login.html">เข้าสู่ระบบ</a></h3>
                        </div>
                        <div class="choose-right">
                            <h3><a id="active" href="../html/register.html">สมัครสมาชิก</a></h3>
                        </div>
                    </div>
                    <div class="form">
                        <div class="choice-pic">
                            
                            <img class="choose-role" src="../img/choose-parents.svg" alt="parent-pic">
                            <img class="choose-role" src="../img/choose-tutor.svg" alt="tutor-pic">

                        </div>
                        <div class="choice-role-text">
                            <div class="role-text-parent">
                                <p>ผู้ปกครอง</p>
                            </div>
                            <div class="role-text-tutor">
                                <p>ติวเตอร์</p>
                            </div>
                        </div>
                        <div class="form-name">
                            <div class="firstname">
                                <label for="fname">ชื่อ <span>*</span></label>
                                <input type="text" name="fname" placeholder="ชื่อ" required maxlength="30">
                            </div>
                            <div class="lastname">
                                <label for="lname">นามสกุล <span>*</span></label>
                                <input type="text" name="lname" placeholder="นามสกุล" required maxlength="30">
                            </div>
                        </div>

                        <div class="password-box">
                            <label for="password">รหัสผ่าน <span>*</span></label>
                            <input type="password" name="password" id="password" placeholder="รหัสผ่าน" required
                                maxlength="30">
                            <i id="eye" class="bi bi-eye-slash"></i>
                        </div>
                        <div class="password-box">
                            <label for="password">ยืนยันรหัสผ่าน <span>*</span></label>
                            <input type="password" name="password" placeholder="ยืนยันรหัสผ่าน" required maxlength="30">
                            <i id="eye" class="bi bi-eye-slash"></i>
                        </div>
                        <div class="email-box">
                            <label for="mail">อีเมล <span>*</span></label>
                            <input type="email" name="mail" placeholder="อีเมล" required maxlength="30">
                        </div>
                        <p class="contact-text">ช่องทางติดต่อ</p>
                        <div class="contact-box">

                            <div class="contact-left">
                                <div class="contact-phone">
                                    <i class="phone bi bi-telephone-fill"></i>
                                    <label for="phone">เบอร์โทรศัพท์</label>
                                </div>
                                <div class="contact-line">
                                    <i class="bi bi-line"></i>
                                    <label for="phone">ไอดีไลน์</label>
                                </div>
                                <div class="contact-facebook">
                                    <i class="bi bi-facebook"></i>
                                    <label for="phone">เฟซบุ๊ก</label>
                                </div>

                            </div>
                            <div class="contact-right">
                                <input type="tel" name="phone" placeholder="0676776767" maxlength="10">
                                <input type="text" name="phone" placeholder="@TutorOfficial" maxlength="20">
                                <input type="text" name="phone" placeholder="TutorOfficial" maxlength="30">
                            </div>

                        </div>
                    </div>
                    <div class="lower">
                        <button class="regist-btn">สมัครสมาชิก</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer></footer>
    <script>
        const eye = document.getElementById("eye");
        const password = document.getElementById("password");

        eye.addEventListener("click", () => {
            if (password.type === "password") {
                password.type = "text";
                eye.classList.replace("bi-eye-slash", "bi-eye-fill");
            } else {
                password.type = "password";
                eye.classList.replace("bi-eye-fill", "bi-eye-slash");
            }
        });
    </script>
    <script>
        const roles = document.querySelectorAll(".choose-role");

        roles.forEach(btn => {
            btn.addEventListener("click", () => {
                roles.forEach(b => b.classList.remove("selected")); // ลบตัวเก่า
                btn.classList.add("selected"); // ใส่ตัวใหม่
            });
        });
    </script>

</body>

</html>
